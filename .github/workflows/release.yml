name: Release
on:
  workflow_dispatch:
    inputs:
      reuse_run:
        description: 'Optional prior run with successful macOS/Linux artifacts (packaging recovery only)'
        required: false
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
        with:
          version: 2026.11.8
          mise_toml: |
            [tools]
            python = "3.13.15"
      - name: Check release version, notes and lockfiles
        run: mise exec -- python scripts/check-release.py
  macos:
    needs: preflight
    if: inputs.reuse_run == ''
    runs-on: macos-15
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      MACOSX_DEPLOYMENT_TARGET: '12.0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
        with:
          version: 2026.11.8
      - id: build-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
            .deps
          key: macos-arm64-release-${{ hashFiles('Cargo.lock', 'mise.toml') }}-${{ github.sha }}
          restore-keys: |
            macos-arm64-release-${{ hashFiles('Cargo.lock', 'mise.toml') }}-
            macos-arm64-release-
      - name: Prepare pinned Ghostty dependency
        run: mise run bootstrap
      - name: Build release on GitHub runner
        run: mise exec -- cargo build --locked --release -p rmux-desktop -p rmux-cli
      - name: Save compiled dependencies before signing
        if: steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
            .deps
          key: macos-arm64-release-${{ hashFiles('Cargo.lock', 'mise.toml') }}-${{ github.sha }}
      - name: Sign, notarize and prepare Sparkle update
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          RMUX_SIGN_IDENTITY: "Developer ID Application: Robert O'Leary (624KJV575U)"
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: mise exec -- python scripts/ci-sign-macos.py
      - name: Preserve release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macos-release
          path: |
            target/releases/*/*.zip
            target/releases/*/*.dmg
            target/releases/*/appcast.xml
          if-no-files-found: error

  portable:
    needs: preflight
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.reuse_run != '' && '{"include":[{"os":"windows-2025","platform":"windows","target":"x86_64-pc-windows-msvc"}]}' || '{"include":[{"os":"ubuntu-24.04","platform":"linux","target":"x86_64-unknown-linux-gnu"},{"os":"windows-2025","platform":"windows","target":"x86_64-pc-windows-msvc"}]}') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: '0'
      RMUX_RELEASE_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
        with:
          version: 2026.11.8
          mise_toml: |
            [tools]
            rust = "1.99.1"
            python = "3.13.15"
            zig = "0.17.0"
      - name: Linux system libraries (runner only)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libfontconfig1-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libvulkan-dev libssl-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - name: Select existing Windows LLVM
        if: matrix.platform == 'windows'
        shell: pwsh
        run: '"LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV'
      - id: build-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
            .deps
            ~/.cache/zig
          key: ${{ matrix.platform }}-release-${{ hashFiles('Cargo.lock', 'mise.toml') }}-${{ github.sha }}
          restore-keys: |
            ${{ matrix.platform }}-release-${{ hashFiles('Cargo.lock', 'mise.toml') }}-
            ${{ matrix.platform }}-release-
      - name: Prepare Linux Ghostty
        if: matrix.platform == 'linux'
        run: mise exec -- sh scripts/bootstrap-ghostty.sh
      - name: Prepare Windows Ghostty
        if: matrix.platform == 'windows'
        run: mise exec -- pwsh -File scripts/bootstrap-ghostty.ps1
      - name: Build native release
        run: mise exec -- cargo build --locked --release -p rmux-desktop -p rmux-cli
      - name: Save native build cache
        if: always() && steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
            .deps
            ~/.cache/zig
          key: ${{ matrix.platform }}-release-${{ hashFiles('Cargo.lock', 'mise.toml') }}-${{ github.sha }}
      - name: Package native release
        run: mise exec -- python scripts/package-portable.py ${{ matrix.platform }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.platform }}-release
          path: target/releases/
          if-no-files-found: error

  reuse:
    needs: preflight
    if: inputs.reuse_run != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
        with:
          version: 2026.11.8
          mise_toml: |
            [tools]
            gh = "2.103.0"
      - name: Verify reused executable sources are identical
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE_RUN: ${{ inputs.reuse_run }}
        run: |
          source_sha=$(mise exec -- gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REUSE_RUN" --jq .head_sha)
          git diff --exit-code "$source_sha" HEAD -- crates vendor Cargo.toml Cargo.lock
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: macos-release
          run-id: ${{ inputs.reuse_run }}
          github-token: ${{ github.token }}
          path: reused/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: linux-release
          run-id: ${{ inputs.reuse_run }}
          github-token: ${{ github.token }}
          path: reused/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reused-release
          path: reused/
          if-no-files-found: error

  publish:
    needs: [macos, portable, reuse]
    if: always() && needs.portable.result == 'success' && (needs.macos.result == 'success' || needs.reuse.result == 'success')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
        with:
          version: 2026.11.8
          mise_toml: |
            [tools]
            python = "3.13.15"
            gh = "2.103.0"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: '*-release'
          merge-multiple: true
          path: target/releases/
      - name: Publish complete release and advance Sparkle feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise exec -- python scripts/publish-release.py
