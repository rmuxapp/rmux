name: Experimental browser
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - crates/rmux-desktop/**
      - crates/rmux-terminal/**
      - crates/rmux-core/**
      - Cargo.toml
      - Cargo.lock
      - mise.toml
      - scripts/bootstrap-ghostty.sh
      - .github/workflows/browser.yml
  pull_request:
    paths:
      - crates/rmux-desktop/**
      - crates/rmux-terminal/**
      - crates/rmux-core/**
      - Cargo.toml
      - Cargo.lock
      - mise.toml
      - scripts/bootstrap-ghostty.sh
      - .github/workflows/browser.yml
permissions:
  contents: read
concurrency:
  group: browser-${{ github.ref }}
  # Finish the active build to warm its cache; GitHub keeps only the latest
  # pending run for this ref during rapid iteration.
  cancel-in-progress: false
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      MACOSX_DEPLOYMENT_TARGET: '12.0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
        with:
          version: 2026.11.8
      - id: build-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
            .deps
          key: browser-macos-${{ hashFiles('Cargo.lock', 'mise.toml') }}-${{ github.sha }}
          # Prefer the newest compiled source with matching dependencies, then
          # fall back to older dependencies. Cache entries are immutable.
          restore-keys: |
            browser-macos-${{ hashFiles('Cargo.lock', 'mise.toml') }}-
            browser-macos-
      - name: Prepare pinned Ghostty dependency
        run: mise run bootstrap
      - name: Test nonblocking focus input
        run: |
          mise exec -- cargo test --locked -p rmux-core keyboard::tests
          mise exec -- cargo test --locked -p rmux-terminal queued_
          mise exec -- cargo test --locked -p rmux-terminal paste
          mise exec -- cargo test --locked -p rmux-terminal opportunistic_snapshot_and_targeted_input_do_not_wait_for_parser_lock
      - name: Test browser policy and state transitions
        run: mise exec -- cargo test --locked -p rmux-desktop --features browser browser_
      - name: Test renderer reclamation and diagnostics
        run: |
          mise exec -- cargo test --locked -p rmux-desktop --features browser row_cache::tests
          mise exec -- cargo test --locked -p rmux-desktop --features browser diagnostics::tests
      - name: Link native composition probe
        run: mise exec -- cargo build --locked -p rmux-desktop --features browser-probe --example browser-probe
      - name: Check default dependency isolation
        run: |
          mise exec -- cargo tree --locked -p rmux-desktop --edges normal --prefix none > /tmp/rmux-default-dependencies.txt
          if grep -q '^wry v' /tmp/rmux-default-dependencies.txt; then
            echo 'WRY must remain absent from default builds.' >&2
            exit 1
          fi
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: success() && github.ref == 'refs/heads/main' && steps.build-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
            .deps
          key: browser-macos-${{ hashFiles('Cargo.lock', 'mise.toml') }}-${{ github.sha }}
