[tools]
python = "3.13.15"
gh = "2.103.0"
"github:sparkle-project/Sparkle" = "2.10.0"
rust = { version = "1.99.1", targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "x86_64-pc-windows-msvc"] }
zig = "0.17.0"

[env]
_.path = ["{{config_root}}/.deps/ghostty-vt/bin"]

[tasks.check]
run = "cargo check --workspace"

[tasks.smoke-events]
description = "Build and check bounded native event replay in an isolated app"
run = "cargo build -p rmux-desktop -p rmux-cli && python scripts/smoke-events.py"

[tasks.check-linux-terminal]
description = "Cross-check Linux terminal code after building its Ghostty dependency"
env.GHOSTTY_VT_DIR = "{{config_root}}/.deps/ghostty-vt-x86_64-linux-gnu"
run = "cargo check -p rmux-terminal --target x86_64-unknown-linux-gnu"

[tasks.check-windows-terminal]
description = "Cross-check Windows terminal code and tests using the extracted pinned package"
env.GHOSTTY_VT_DIR = "{{config_root}}/.deps/ghostty-vt-1.0.1-x86_64-windows-gnu"
run = "cargo check -p rmux-terminal --tests --target x86_64-pc-windows-msvc"

[tasks.build-linux-tests]
description = "Cross-link Linux terminal tests with mise-managed Zig"
env.GHOSTTY_VT_DIR = "{{config_root}}/.deps/ghostty-vt-x86_64-linux-gnu"
env.CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER = "{{config_root}}/scripts/zig-linux-linker.sh"
run = "cargo test -p rmux-terminal --lib --target x86_64-unknown-linux-gnu --no-run"

[tasks.build-linux-arm64-tests]
description = "Cross-link ARM64 Linux terminal tests with mise-managed Zig"
env.GHOSTTY_VT_DIR = "{{config_root}}/.deps/ghostty-vt-aarch64-linux-gnu"
env.CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER = "{{config_root}}/scripts/zig-linux-linker.sh"
env.RMUX_ZIG_TARGET = "aarch64-linux-gnu"
run = "cargo test -p rmux-terminal --lib --target aarch64-unknown-linux-gnu --no-run"

[tasks.check-linux-desktop]
description = "Cross-check GPUI and rmux desktop for ARM64 Linux (no link or runtime validation)"
env.GHOSTTY_VT_DIR = "{{config_root}}/.deps/ghostty-vt-aarch64-linux-gnu"
env.RMUX_ZIG_TARGET = "aarch64-linux-gnu"
env.CC_aarch64_unknown_linux_gnu = "{{config_root}}/scripts/zig-linux-linker.sh"
env.CXX_aarch64_unknown_linux_gnu = "{{config_root}}/scripts/zig-linux-linker.sh"
env.AR_aarch64_unknown_linux_gnu = "{{config_root}}/scripts/zig-ar.sh"
run = "cargo check -p rmux-desktop --target aarch64-unknown-linux-gnu"

[tasks.test]
run = "cargo test --workspace"

[tasks.smoke-ssh]
description = "Build and exercise isolated native SSH lifecycle with a local no-network fixture"
run = "cargo build -p rmux-desktop -p rmux-cli && python scripts/smoke-ssh.py"

[tasks.bench-rpc-splits]
description = "Measure native macOS debug RPC split creation and app RSS at 1/8/32 panes"
run = "cargo build -p rmux-desktop -p rmux-cli && python scripts/bench-rpc-splits.py"

[tasks.smoke-ssh-loopback]
description = "Check native SSH authentication using existing macOS OpenSSH and temporary loopback keys"
run = "cargo build -p rmux-desktop -p rmux-cli && python scripts/smoke-ssh-loopback.py"

[tasks.test-zsh-integration]
description = "Check shell integration with an existing zsh, without user rc files"
run = "python3 scripts/test-zsh-integration.py"

[tasks.test-bash-integration]
description = "Check shell integration with an existing Bash, without user startup files"
run = "python3 scripts/test-bash-integration.py"

[tasks.run]
run = "cargo run -p rmux-desktop"

[tasks.bundle]
run = "sh scripts/bundle-macos.sh"

[tasks.bundle-release]
run = "RMUX_BUILD_PROFILE=release sh scripts/bundle-macos.sh"

[tasks.open-app]
description = "Build and open the local macOS release app"
depends = ["bundle-release"]
run = "open target/release/rmux.app"

[tasks.preview-ui]
description = "Launch isolated synthetic workspace for native visual comparison"
run = ["cargo build -p rmux-desktop", "python3 scripts/preview-workspace.py"]

[tasks.smoke-release]
description = "Exercise the bundled release executable with isolated live shells"
depends = ["bundle-release"]
run = "python3 scripts/smoke-live-rpc.py target/release/rmux.app/Contents/MacOS/rmux --live-shell"

[tasks.fmt]
run = "cargo fmt --all"

[tasks.bootstrap]
run = "sh scripts/bootstrap-ghostty.sh"

[tasks.bootstrap-windows]
run = "powershell -NoProfile -File scripts/bootstrap-ghostty.ps1"

[tasks.bundle-windows]
run = "powershell -NoProfile -File scripts/bundle-windows.ps1"

[tasks.bench-engine]
description = "Release engine-only throughput and snapshot baseline for 1/4/8/16 panes"
run = "cargo build --release -p rmux-terminal --example engine_bench && for panes in 1 4 8 16; do target/release/examples/engine_bench $panes; done"

[tasks.bench-pty]
description = "Release input/response timings under PTY output pressure at 1/4/8/16 panes"
run = "cargo run --release -p rmux-terminal --example pty_bench -- all"

[tasks.bench-selection]
description = "Release selection formatting timings at 4/64 MiB retention"
run = "cargo run --release -p rmux-terminal --example selection_bench"

[tasks.bench-history]
description = "Release history export lock-duration baseline at 4/64 MiB retention"
run = "cargo run --release -p rmux-terminal --example history_bench"

[tasks.bench-process-sampling]
description = "Manual Unix debug-build process sampling baseline for 1/8/32 shells"
run = "cargo test -p rmux-desktop process_metrics::tests::sampling_scaling -- --ignored --nocapture"

[tasks.bench-process-trees]
description = "Manual Unix debug-build process-tree sampling baseline for 1/8/32 shells"
run = "cargo test -p rmux-desktop process_metrics::tests::tree_sampling_scaling -- --ignored --nocapture"

[tasks.bench-process-tree-children]
description = "Manual Unix process-tree baseline for 1/8/32 shells with four children each"
run = "cargo test -p rmux-desktop process_metrics::tests::tree_children_sampling_scaling -- --ignored --nocapture"

[tasks.bench-history-search]
description = "Manual incremental history-search baseline for 1/8/32 terminals"
run = "cargo test -p rmux-terminal history_probe_scaling -- --ignored --nocapture"

[tasks.bench-snapshot-allocations]
description = "Count Rust allocation traffic during 1/8/32 terminal snapshots"
run = "cargo run -p rmux-terminal --example snapshot_alloc_bench"

[tasks.smoke-session-restore]
description = "Native Unix multi-window session restore with isolated fixture shells"
run = ["cargo build -p rmux-desktop", "python3 scripts/smoke-session-restore.py"]

[tasks.smoke-live-rpc]
description = "Short Unix native GUI/RPC check using an isolated process and immediately exiting shell"
run = ["cargo build -p rmux-desktop", "python3 scripts/smoke-live-rpc.py"]

[tasks.test-fish-integration]
description = "Check fish startup and native-marker delegation with a pinned mise shell"
run = "mise exec aqua:fish-shell/fish-shell@4.9.3 -- python scripts/test-fish-integration.py"

[tasks.smoke-live-sessions]
description = "Verify native workspace transfer preserves live fixture-shell PIDs"
run = ["cargo build -p rmux-desktop", "python3 scripts/smoke-live-rpc.py --live-shell"]

[tasks.smoke-socket]
description = "Check private Unix socket RPC clients and endpoint lifecycle"
run = ["cargo build -p rmux-desktop -p rmux-cli", "python3 scripts/smoke-socket-rpc.py"]

[tasks.smoke-group-directory]
description = "Verify group directory overrides with isolated native shells"
run = ["cargo build -p rmux-desktop", "python3 scripts/smoke-group-directory.py"]

[tasks.smoke-bundle-socket]
description = "Exercise both packaged macOS executables over the private socket"
depends = ["bundle"]
run = "python3 scripts/smoke-socket-rpc.py --app target/debug/rmux.app/Contents/MacOS/rmux --client target/debug/rmux.app/Contents/MacOS/rmuxctl"

[tasks.release-macos]
description = "Build, Developer ID sign, notarize, staple and Sparkle-sign the macOS release"
run = "sh scripts/release-macos.sh"

[tasks.bench-palette-search]
description = "Compare optimized palette filtering with full rescans, without a GUI"
run = ["mkdir -p target", "rustc --edition=2024 -O scripts/bench-palette-search.rs -o target/bench-palette-search", "./target/bench-palette-search"]

[tasks.bench-keyboard]
description = "Release key dispatch timings into an output-flooding pane at 1/4/8/16 panes"
run = "cargo run --release -p rmux-terminal --example pty_bench -- keyboard"

[tasks.bench-focus]
description = "Release focus dispatch timings into output-flooding panes at 1/4/8/16 panes"
run = "cargo run --release -p rmux-terminal --example pty_bench -- focus"

[tasks.bench-file-loaders]
description = "Measure bounded local directory and text-preview reads (debug profile)"
run = "cargo test -p rmux-desktop file_loader_baseline -- --ignored --nocapture"

[tasks.browser-probe]
description = "Opt-in macOS GPUI/native-webview composition probe"
run = "cargo run -p rmux-desktop --features browser-probe --example browser-probe"

[tasks.browser]
description = "Run rmux with experimental macOS browser windows enabled"
run = "cargo run -p rmux-desktop --features browser --bin rmux"

[tasks.test-powershell-integration]
description = "Check opt-in PowerShell prompt hooks using a mise-managed runtime"
run = "mise exec powershell@7.5.4 -- pwsh -NoProfile -NonInteractive -File scripts/test-powershell-integration.ps1"

[tasks.test-powershell-startup]
description = "Check automatic PowerShell startup in a macOS PTY"
run = "mise exec powershell@7.5.4 -- cargo test -p rmux-terminal automatic_powershell_reports -- --ignored"

[tasks.bench-queued-focus]
description = "Measure queued focus admission under output pressure, excluding delivery and UI"
run = "cargo run --release -p rmux-terminal --example pty_bench -- queued-focus"

[tasks.bench-queued-keyboard]
description = "Measure queued key admission and native text routing under 1/4/8/16 busy panes"
run = "cargo run --release -p rmux-terminal --example pty_bench -- queued-keyboard"

[tasks.smoke-native-quit]
description = "Check AppKit quit routing, cancellation and approval in an isolated app"
run = ["cargo build -p rmux-desktop --example native-quit-probe", "python scripts/smoke-native-quit.py"]

[tasks.test-fish-startup]
description = "Check automatic fish integration through a real macOS PTY"
run = "mise exec aqua:fish-shell/fish-shell@4.9.3 -- cargo test -p rmux-terminal automatic_fish_reports -- --ignored"

[tasks.generate-dmg-layout]
description = "Regenerate and verify the checked-in macOS installer icon layout"
run = "mise exec uv@0.9.11 -- uv run --with ds-store==1.3.1 python scripts/generate-dmg-layout.py"
