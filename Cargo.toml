[workspace]
members = ["crates/rmux-core", "crates/rmux-terminal", "crates/rmux-desktop", "crates/rmux-cli", "crates/rmux-protocol"]
resolver = "3"
exclude = ["vendor/mac-usernotifications"]

[workspace.package]
license = "MIT"
version = "0.1.7"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
anyhow = "1.0"
async-channel = "2.5"
gpui = "=0.2.2"
portable-pty = "=0.9.0"

[profile.dev]
debug = 1

[patch.crates-io]
xattr = { path = "vendor/xattr" }
mac-usernotifications = { path = "vendor/mac-usernotifications" }

[profile.release]
lto = "thin"
codegen-units = 1
