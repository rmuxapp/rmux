[tools]
node = "24.22.0"
rust = { version = "1.99.1", targets = ["wasm32-unknown-unknown"] }

"github:wasm-bindgen/wasm-bindgen" = "0.2.130"

[tasks.build]
depends = ["build-native-vt"]
run = ["cargo build --locked --lib --target wasm32-unknown-unknown", "wasm-bindgen --target web --out-dir dist target/wasm32-unknown-unknown/debug/rmux_web_probe.wasm", "cp index.html engine.js native-vt.js native-vt-render.js native-vt-selection.js dist/", "cp ../../.deps/ghostty-vt-wasm32-freestanding/bin/ghostty-vt.wasm dist/native-ghostty-vt.wasm", "cp ../../.deps/libghostty-vt-1.0.1/LICENSE dist/libghostty-vt-LICENSE"]

[tasks.serve]
run = "python -m http.server 4319 --bind 127.0.0.1 --directory dist"

[tasks.check]
run = "cargo check --target wasm32-unknown-unknown"

[tasks.build-native-vt]
description = "Build the desktop libghostty-vt version for browser integration"
dir = "../.."
run = "RMUX_GHOSTTY_TARGET=wasm32-freestanding mise exec -- sh scripts/build-ghostty-source.sh"

[tasks.check-native-vt]
description = "Check the direct desktop-engine WASM adapter (build-native-vt first)"
run = "node scripts/check-native-vt.mjs"

[tasks.bench-native-vt]
description = "Measure the current direct engine adapter across 1/4/16 panes"
run = "node scripts/bench-native-vt.mjs"

[tasks.bench-browser-engine]
depends = ["prepare-legacy-benchmark"]
description = "Measure the Ghostty WASM/JSON boundary at 1, 4 and 16 panes (build first)"
run = "node scripts/bench-browser-engine.mjs"

[tasks.build-release]
description = "Build the optimized shared UI artifact for static hosting"
depends = ["build-native-vt"]
run = ["cargo build --locked --release --lib --target wasm32-unknown-unknown", "wasm-bindgen --target web --out-dir dist-release target/wasm32-unknown-unknown/release/rmux_web_probe.wasm", "cp index.html engine.js native-vt.js native-vt-render.js native-vt-selection.js dist-release/", "cp ../../.deps/ghostty-vt-wasm32-freestanding/bin/ghostty-vt.wasm dist-release/native-ghostty-vt.wasm", "cp ../../.deps/libghostty-vt-1.0.1/LICENSE dist-release/libghostty-vt-LICENSE", "cp ../../LICENSE dist-release/rmux-LICENSE", "cp assets/FiraMono-LICENSE assets/Inter-OFL.txt dist-release/", "RMUX_RELEASE_TARGET=wasm32-unknown-unknown python ../../scripts/release-notices.py dist-release/THIRD_PARTY_NOTICES.txt", "node scripts/report-release.mjs"]

[tasks.prepare-legacy-benchmark]
description = "Prepare historical ghostty-web benchmark dependencies only"
run = ["npm ci --ignore-scripts", "mkdir -p dist", "cp legacy-engine.js dist/", "cp node_modules/ghostty-web/dist/ghostty-web.js node_modules/ghostty-web/dist/ghostty-vt.wasm node_modules/ghostty-web/LICENSE dist/"]
