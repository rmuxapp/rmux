[tools]
rust = { version = "1.99.1", targets = ["wasm32-unknown-unknown"] }

"github:wasm-bindgen/wasm-bindgen" = "0.2.130"

[tasks.build]
run = ["cargo build --locked --lib --target wasm32-unknown-unknown", "wasm-bindgen --target web --out-dir dist target/wasm32-unknown-unknown/debug/rmux_web_probe.wasm", "cp index.html dist/index.html"]

[tasks.serve]
run = "python -m http.server 4319 --bind 127.0.0.1 --directory dist"

[tasks.check]
run = "cargo check --target wasm32-unknown-unknown"
